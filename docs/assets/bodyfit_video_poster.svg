<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="playBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEmerald" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#glowCyan)"/>
  <rect width="1280" height="720" fill="url(#glowEmerald)"/>

  <!-- Cyber Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="270" x2="1280" y2="270"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="450" x2="1280" y2="450"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="0" y1="630" x2="1280" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
  </g>

  <!-- Top Header / Pill Badges -->
  <g transform="translate(60, 50)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="21" cy="21" r="13" fill="url(#playBtnGrad)"/>
    <path d="M16 21 L19 25 L26 17" fill="none" stroke="#030712" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#F8FAFC">Body2Fit</text>
    <rect x="140" y="10" width="68" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="174" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#34D399" text-anchor="middle">IJCAI '26</text>

    <!-- Duration Pill -->
    <rect x="1040" y="0" width="120" height="42" rx="21" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <circle cx="1062" cy="21" r="5" fill="#EF4444"/>
    <text x="1076" y="27" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="14" fill="#F8FAFC">00:20 HD</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(60, 160)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#F8FAFC" letter-spacing="-1px">
      Dual-View Silhouette Anthropometry
    </text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#38BDF8">
      with an SMPL-X 3D Geometry Reliability Gate
    </text>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="17" fill="#94A3B8">
      Replaces 180-year-old BMI with tape-accurate circumferences (Waist MAE 1.97cm) from 2 phone photos.
    </text>
  </g>

  <!-- Left: Dual Silhouettes Wireframe Showcase Card -->
  <g transform="translate(60, 280)" filter="url(#cardShadow)">
    <rect width="280" height="340" rx="18" fill="rgba(17, 24, 39, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="24" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748B">ORTHOGONAL CAPTURES</text>
    
    <!-- Front Silhouette Shape -->
    <g transform="translate(45, 60)">
      <rect x="0" y="0" width="80" height="200" rx="40" fill="rgba(6, 182, 212, 0.12)" stroke="#06B6D4" stroke-width="2"/>
      <!-- Scan line -->
      <line x1="0" y1="80" x2="80" y2="80" stroke="#38BDF8" stroke-width="2" filter="url(#glowFilter)"/>
      <text x="40" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">Front View</text>
      <text x="40" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="middle">640×480</text>
    </g>

    <!-- Side Silhouette Shape -->
    <g transform="translate(155, 60)">
      <rect x="0" y="0" width="60" height="200" rx="30" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="2"/>
      <line x1="0" y1="120" x2="60" y2="120" stroke="#34D399" stroke-width="2" filter="url(#glowFilter)"/>
      <text x="30" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">Side View</text>
      <text x="30" y="240" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" text-anchor="middle">640×480</text>
    </g>

    <rect x="24" y="285" width="232" height="34" rx="8" fill="rgba(255, 255, 255, 0.04)"/>
    <text x="140" y="306" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">Symmetric InfoNCE (τ=0.07)</text>
  </g>

  <!-- Center: Central Big Interactive Play Button -->
  <g transform="translate(640, 450)">
    <!-- Outer Pulsing Ring -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="62" fill="rgba(17, 24, 39, 0.9)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
    
    <!-- Play Circle Button -->
    <circle cx="0" cy="0" r="50" fill="url(#playBtnGrad)"/>
    <!-- Triangle Play Icon -->
    <polygon points="-12,-18 18,0 -12,18" fill="#030712"/>

    <!-- Callout Text -->
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="0.5px">
      CLICK TO WATCH 20s LAUNCH DEMO
    </text>
    <text x="0" y="112" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34D399" text-anchor="middle">
      1080p 60fps · Sound On ♫
    </text>
  </g>

  <!-- Right: 3D SMPL-X Gate Scorecard Showcase Card -->
  <g transform="translate(940, 280)" filter="url(#cardShadow)">
    <rect width="280" height="340" rx="18" fill="rgba(17, 24, 39, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <g transform="translate(24, 28)">
      <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#64748B">GEOMETRY RELIABILITY GATE</text>
      
      <!-- Metric 1: Waist -->
      <g transform="translate(0, 36)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Waist Circumference</text>
        <text x="232" y="0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#F8FAFC" text-anchor="end">91.65 cm</text>
        <text x="232" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399" text-anchor="end">MAE 0.85 cm</text>
      </g>

      <!-- Metric 2: IoU -->
      <g transform="translate(0, 88)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Render-Back IoU</text>
        <text x="232" y="0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#34D399" text-anchor="end">76.57%</text>
        <text x="232" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B" text-anchor="end">Cutoff ≥ 55%</text>
      </g>

      <!-- Metric 3: Chamfer -->
      <g transform="translate(0, 140)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94A3B8">Contour Chamfer</text>
        <text x="232" y="0" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#38BDF8" text-anchor="end">0.0096</text>
        <text x="232" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B" text-anchor="end">Cutoff ≤ 0.05</text>
      </g>

      <!-- Verdict Banner -->
      <g transform="translate(0, 196)">
        <rect width="232" height="64" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5"/>
        <circle cx="28" cy="32" r="14" fill="#10B981"/>
        <path d="M22 32 L26 36 L34 27" fill="none" stroke="#030712" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#34D399">VERDICT: ACCEPTED</text>
        <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#94A3B8">3D mesh explains silhouettes</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar / Punchline -->
  <g transform="translate(60, 670)">
    <line x1="0" y1="0" x2="1160" y2="0" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B">
      Zero nude photos · Zero clinical radiation · Zero black-box hallucinations
    </text>
    <text x="1160" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="end">
      github.com/Chirudeva-Reddy/body2health
    </text>
  </g>
</svg>
