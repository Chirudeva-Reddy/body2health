  <g>
    <rect x="880" y="404" width="180" height="58" rx="10"
          fill="#2d2410" stroke="#d29922" stroke-width="1.5"/>
    <text x="970" y="429" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600"
          fill="#d29922">Abstain</text>
    <text x="970" y="449" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14"
          fill="#8b949e">recapture requested</text>
  </g>
  <text x="40" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">No number is reported unless the fitted 3D body</text>
  <text x="40" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">explains the silhouettes it came from.</text>
