    <text x="64" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#4493f8" font-weight="600">1</text>
    <text x="90" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#e6edf3" font-weight="600">Dual-view capture</text>
    <text x="64" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#8b949e">Front and side RGB, plus height</text>
  </g>

  <g>
    <rect x="400" y="50" width="320" height="120" rx="12"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="424" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#4493f8" font-weight="600">2</text>
    <text x="450" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#e6edf3" font-weight="600">Segmentation</text>
    <text x="424" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
