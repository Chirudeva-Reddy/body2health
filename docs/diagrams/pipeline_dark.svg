  </g>
  <line x1="360" y1="290" x2="392" y2="290" stroke="#30363d" stroke-width="2" marker-end="url(#tip)"/>
  <line x1="720" y1="290" x2="752" y2="290" stroke="#30363d" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 920 350 L 920 370 L 750 370 L 750 395" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 920 350 L 920 370 L 970 370 L 970 395" fill="none" stroke="#d29922" stroke-width="2" marker-end="url(#tip)"/>

  <g>
    <rect x="660" y="404" width="180" height="58" rx="10"
