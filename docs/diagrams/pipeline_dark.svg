    <text x="424" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#8b949e">WHtR, WHR and BRI, derived</text>
  </g>

  <g>
    <rect x="760" y="230" width="320" height="120" rx="12"
