    <text x="784" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#8b949e">Twin ResNet-18, InfoNCE aligned</text>
  </g>
  <line x1="360" y1="110" x2="392" y2="110" stroke="#30363d" stroke-width="2" marker-end="url(#tip)"/>
  <line x1="720" y1="110" x2="752" y2="110" stroke="#30363d" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 920 170 L 920 186 Q 920 200 906 200 L 214 200 Q 200 200 200 214 L 200 222" fill="none" stroke="#30363d" stroke-width="2" marker-end="url(#tip)"/>

  <g>
    <rect x="40" y="230" width="320" height="120" rx="12"
