<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-label="Six pipeline stages feed an SMPL-X geometry gate. The gate either reports the measurements or abstains and asks for a recapture.">
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d0d7de"/>
    </marker>
  </defs>
  <rect width="1120" height="500" fill="#ffffff"/>

  <g>
    <rect x="40" y="50" width="320" height="120" rx="12"
          fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="64" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#0969da" font-weight="600">1</text>
    <text x="90" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#1f2328" font-weight="600">Dual-view capture</text>
    <text x="64" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#656d76">Front and side RGB, plus height</text>
  </g>

  <g>
    <rect x="400" y="50" width="320" height="120" rx="12"
          fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="424" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#0969da" font-weight="600">2</text>
    <text x="450" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#1f2328" font-weight="600">Segmentation</text>
    <text x="424" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#656d76">YOLOv11m detector, SAM 2.1 masks</text>
  </g>

  <g>
    <rect x="760" y="50" width="320" height="120" rx="12"
          fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="784" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#0969da" font-weight="600">3</text>
    <text x="810" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#1f2328" font-weight="600">Siamese encoders</text>
    <text x="784" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#656d76">Twin ResNet-18, InfoNCE aligned</text>
  </g>
  <line x1="360" y1="110" x2="392" y2="110" stroke="#d0d7de" stroke-width="2" marker-end="url(#tip)"/>
  <line x1="720" y1="110" x2="752" y2="110" stroke="#d0d7de" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 920 170 L 920 186 Q 920 200 906 200 L 214 200 Q 200 200 200 214 L 200 222" fill="none" stroke="#d0d7de" stroke-width="2" marker-end="url(#tip)"/>

  <g>
    <rect x="40" y="230" width="320" height="120" rx="12"
          fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="64" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#0969da" font-weight="600">4</text>
    <text x="90" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#1f2328" font-weight="600">Girth regression</text>
    <text x="64" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#656d76">Waist, hip and chest in cm</text>
  </g>

  <g>
    <rect x="400" y="230" width="320" height="120" rx="12"
          fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="424" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#0969da" font-weight="600">5</text>
    <text x="450" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#1f2328" font-weight="600">Clinical indices</text>
    <text x="424" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#656d76">WHtR, WHR and BRI, derived</text>
  </g>

  <g>
    <rect x="760" y="230" width="320" height="120" rx="12"
          fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="784" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"
          fill="#0969da" font-weight="600">6</text>
    <text x="810" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20"
          fill="#1f2328" font-weight="600">SMPL-X geometry gate</text>
    <text x="784" y="304" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"
          fill="#656d76">Fits a 3D body, renders it back</text>
  </g>
  <line x1="360" y1="290" x2="392" y2="290" stroke="#d0d7de" stroke-width="2" marker-end="url(#tip)"/>
  <line x1="720" y1="290" x2="752" y2="290" stroke="#d0d7de" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 920 350 L 920 370 L 750 370 L 750 395" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M 920 350 L 920 370 L 970 370 L 970 395" fill="none" stroke="#9a6700" stroke-width="2" marker-end="url(#tip)"/>

  <g class="">
    <rect x="660" y="404" width="180" height="58" rx="10"
          fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="750" y="429" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600"
          fill="#1a7f37">Report</text>
    <text x="750" y="449" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14"
          fill="#656d76">render-back agrees</text>
  </g>

  <g class="">
    <rect x="880" y="404" width="180" height="58" rx="10"
          fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
    <text x="970" y="429" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600"
          fill="#9a6700">Abstain</text>
    <text x="970" y="449" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14"
          fill="#656d76">recapture requested</text>
  </g>
  <text x="40" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#656d76">No number is reported unless the fitted 3D body</text>
  <text x="40" y="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#656d76">explains the silhouettes it came from.</text>
</svg>
